# ブログ全体の設定
title: 40代パパの暮らしラク化ノート
description: >-
  製造業で交代勤務(夜勤あり)をしながら、小5と大学生の二人を子育て中の40代パパ。
  実際に使って「効いた」ものだけを紹介します。
  ※当ブログにはアフィリエイトリンク(広告)を含む記事があります。
lang: ja
url: "https://papa-kurashi-raku.github.io"
